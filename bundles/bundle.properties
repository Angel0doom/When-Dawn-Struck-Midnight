unit.whendawnstruckmidnight-u1-t6-monarch.name = Monarch
unit.whendawnstruckmidnight-u1-t6-monarch.description = Fires bursts of heavy bullets at enemy targets. Does better in combat the longer it is in combat.
unit.whendawnstruckmidnight-u2-t6-aves.name = Aves
unit.whendawnstruckmidnight-u2-t6-aves.description = Rapdily fires piercing lasers that damage enemies and repair allied structures. Shocks all enemy units and structures that are in its designated field. Can step over most terrain.
unit.whendawnstruckmidnight-u4-t6-chrisom.name = Chrisom
unit.whendawnstruckmidnight-u4-t6-chrisom.description = Fires a heavy assortment of large weaponry at enemy targets.
unit.whendawnstruckmidnight-u8-t6-subjugate.name = Subjugate
unit.whendawnstruckmidnight-u8-t6-subjugate.description = Fires continuously exploding bullets at enemy targets.
