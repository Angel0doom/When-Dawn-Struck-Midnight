liquid.whendawnstruckmidnight-01-i1-yellow-mana-liquid.name = Yellow Mana
liquid.whendawnstruckmidnight-01-i1-yellow-mana-liquid.description = Condensed yellow mana in liquid form. Used in magical applications.
