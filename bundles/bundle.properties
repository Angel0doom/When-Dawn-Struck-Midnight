unit.whendawnstruckmidnight-u01-t6-monarch.name = Monarch
unit.whendawnstruckmidnight-u01-t6-monarch.description = Fires bursts of heavy bullets at enemy targets. Does better in combat the longer it is in combat.
unit.whendawnstruckmidnight-u02-t6-aves.name = Aves
unit.whendawnstruckmidnight-u02-t6-aves.description = Rapdily fires piercing lasers that damage enemies and repair allied structures. Shocks all enemy units and structures that are in its designated field. Can step over most terrain.
unit.whendawnstruckmidnight-u04-t6-chrisom.name = Chrisom
unit.whendawnstruckmidnight-u04-t6-chrisom.description = Fires a heavy assortment of large weaponry at enemy targets.
unit.whendawnstruckmidnight-u08-t6-subjugate.name = Subjugate
unit.whendawnstruckmidnight-u08-t6-subjugate.description = Fires continuously exploding bullets at enemy targets.
unit.whendawnstruckmidnight-01-u1-sorcerer.name = Sorcerer
unit.whendawnstruckmidnight-01-u1-sorcerer.description = Fires charged magical bullets at ennemy targets to protect the Focus core.
#items
item.whendawnstruckmidnight-01-i1-metalloid.name = Metalloid
item.whendawnstruckmidnight-01-i1-metalloid.description = A strange metal found on Arecius, has magical properties.
item.whendawnstruckmidnight-01-i2-yellow-mana-crystal-shard.name = Yellow Mana Shard
item.whendawnstruckmidnight-01-i2-yellow-mana-crystal-shard.description = Weak solidified yellow mana. Used in magical applications.
#liquids
liquid.whendawnstruckmidnight-01-i1-yellow-mana-liquid.name = Yellow Mana
liquid.whendawnstruckmidnight-01-i1-yellow-mana-liquid.description = Condensed yellow mana in liquid form. Used in magical applications.
#blocks
block.whendawnstruckmidnight-00-c1-core-focus.name = Core: Focus
block.whendawnstruckmidnight-00-c1-core-focus.description = Core of the base. Slightly armored. Once destroyed, the sector is lost.
block.whendawnstruckmidnight-01-l1-conduction-duct.name = Conduction Duct
block.whendawnstruckmidnight-01-l1-conduction-duct.description = Transports items using the weak magical pull from metalloid.
block.whendawnstruckmidnight-01-d1-metalloid-extractor.name = Metalloid Extractor
block.whendawnstruckmidnight-01-d1-metalloid-extractor.description = A weak drill used to extract metalloid.
block.whendawnstruckmidnight-01-d2-ground-extractor.name = Ground Extractor
block.whendawnstruckmidnight-01-d2-ground-extractor.description = Extracts ground materials using yellow mana. Cannot mine metalloid in usable chunks.
block.whendawnstruckmidnight-01-p1-yellow-mana-concentrator.name = Yellow Mana Concentrator
block.whendawnstruckmidnight-01-p1-yellow-mana-concentrator.description = Condenses yellow mana into usable liquid form by resonating it with metalloid.
block.whendawnstruckmidnight-metalloid-wall.name = Metalloid Wall
block.whendawnstruckmidnight-metalloid-floor.name = Metalloid Floor
block.whendawnstruckmidnight-metalloid-ore.name = Metalloid
block.whendawnstruckmidnight-metalloid-orbs.name = Metalloid Orbs
block.whendawnstruckmidnight-yellow-crystal-mana-wall.name = Yellow Mana Crystal Wall
block.whendawnstruckmidnight-yellow-crystal-mana-floor.name = Yellow Mana Crystal Floor
block.whendawnstruckmidnight-01-d1-metalloid-wall.name = Metalloid Wall
block.whendawnstruckmidnight-01-d1-metalloid-wall.description = Simple wall made out of metalloid. Posesses no useful magical properties, simply blocks most bullets.
block.whendawnstruckmidnight-01-d2-large-metalloid-wall.name =Large Metalloid Wall
block.whendawnstruckmidnight-01-d2-large-metalloid-wall.description =Larger simple wall made out of metalloid. Posesses no useful magical properties, simply blocks most bullets.
